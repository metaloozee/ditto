packages:
  - apps/*
  - packages/runtime-contracts
overrides:
  'alchemy>miniflare': 4.20260710.0
packageExtensions:
  # Streamdown 2.5.0 omits the @types/react peer needed by strict pnpm TypeScript workspaces; remove this extension when upstream declares that peer.
  streamdown@2.5.0:
    peerDependencies:
      '@types/react': '*'
allowBuilds:
  '@google/genai': true
  '@mongodb-js/zstd': false
  better-sqlite3: true
  core-js-pure: false
  esbuild: true
  lefthook: true
  lightningcss: true
  msgpackr-extract: true
  msw: true
  node-liblzma: false
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAge: 0
patchedDependencies:
  # vitest-pool-workers 0.12.21 (and 0.23.0) wraps each entrypoint/DO class prototype in a new Proxy on every construction, so property lookups slow down with each instance. Remove when upstream wraps the prototype once.
  # It also pops isolated storage right after aborting Durable Objects, before their SQLite connections close, so a busy object's -shm/-wal file fails the pop and stalls the run. The patch waits for those files to go before push and pop.
  '@cloudflare/vitest-pool-workers@0.12.21': patches/@cloudflare__vitest-pool-workers@0.12.21.patch
